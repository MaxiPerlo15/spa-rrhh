spring:
  application:
    name: rrhh-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/spa_rrhh_db
    username: maxiperlo
    password:
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SESSIONID
        http-only: true
        secure: true
        same-site: lax

rrhh:
  security:
    # Required from the environment; do not commit a default token.
    internal-api-token: ${RRHH_SECURITY_INTERNAL_API_TOKEN}
    allow-unauthenticated-mutations: false
