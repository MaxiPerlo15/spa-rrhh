# OpenSpec configuration — spa-rrhh
# Auto-generated by sdd-init. Do not edit manually unless you understand the SDD contract.

context: |
  Next.js 16 App Router with React 19, TypeScript strict, Prisma 7 + PostgreSQL.
  Clean architecture: src/app (routes), src/application (use cases), src/domain (entities, state machines),
  src/infrastructure (export, persistence). Secondary Spring Boot backend in backend/.
  Sentry error tracking, NextAuth v4 auth, Tailwind v4 CSS.

strict_tdd: true

testing:
  runner:
    name: Vitest
    command: npm run test:unit
  coverage:
    enabled: true
    command: npm run test:coverage
    thresholds:
      statements: 80
      branches: 75
      functions: 80
      lines: 80
  e2e:
    name: Playwright
    command: npm run test:e2e
  layers:
    unit: true
    integration: false
    e2e: true
  quality:
    linter:
      name: ESLint
      command: npm run lint
    type_checker:
      name: TypeScript (tsc)
      command: npm run typecheck
    formatter: null

phases:
  propose:
    required: true
    approval: orchestrator
  spec:
    required: true
    validation: review scenarios match requirements
  design:
    required: true
    validation: match spec before implementation
  tasks:
    required: true
    budget: 400 lines per review slice
  apply:
    required: true
    test_before_commit: true
  verify:
    required: true
    gates:
      - test:unit
      - test:coverage
      - lint
      - typecheck
  archive:
    required: true
